        body { font-family: 'Inter', sans-serif; }

        }

            background: radial-gradient(at 0% 0%, rgba(0, 74, 198, 0.1) 0px, transparent 50%),

        }

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tap-highlight-transparent { -webkit-tap-highlight-color: transparent; }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface text-on-surface min-h-screen flex flex-col overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container bg-gradient-mesh">
<!-- Hero Background Animation -->
<div class="fixed inset-0 -z-10 opacity-30 pointer-events-none">

</div>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile">
<div class="w-full max-w-md space-y-lg animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Brand Identity Section -->
<header class="text-center space-y-sm">
<div class="inline-flex items-center justify-center p-md rounded-xl bg-primary/10 mb-md">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">location_searching</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Lost &amp; Found BD</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Connecting lost belongings with their owners.</p>
</header>
<!-- Login Form Card -->
<div class="glass-card rounded-2xl p-lg shadow-sm shadow-primary/10 space-y-lg relative overflow-hidden">
<div class="space-y-xs">
<h2 class="font-title-lg text-title-lg text-on-surface">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<form class="space-y-md" onsubmit="event.preventDefault()">
<!-- Email Input Group -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-xs" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full h-14 pl-12 pr-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant transition-all font-body-md text-body-md" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Input Group -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-xs" for="password">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-14 pl-12 pr-12 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant transition-all font-body-md text-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors material-symbols-outlined tap-highlight-transparent" type="button">visibility</button>
</div>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between px-xs">
<label class="flex items-center gap-2 cursor-pointer tap-highlight-transparent">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 bg-transparent" type="checkbox"/>
<span class="font-label-lg text-label-lg text-on-surface-variant">Remember me</span>
</label>
<a class="font-label-lg text-label-lg text-primary hover:underline underline-offset-4 decoration-2 font-semibold" href="#">Forgot Password?</a>
</div>
<!-- Primary Submit Button -->
<button class="w-full h-14 rounded-full bg-gradient-to-r from-primary to-secondary text-on-primary font-title-md text-title-md shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        Sign In
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative py-sm flex items-center">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="mx-4 font-label-sm text-label-sm text-outline-variant uppercase tracking-widest">Or continue with</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-3 h-12 rounded-xl bg-surface-container-high hover:bg-surface-container-highest transition-colors tap-highlight-transparent border border-white/50">
<div class="w-5 h-5" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC70W6mzA3zO-4THflYq_sBouijrl9XR8HuGxr418VaDNraxhXt-AkTZG-b5yfuqhGXOmpORULbhQwrxM_96mbBPfPZ4hrdDwy_ynvFxY9zAivaSQNstg6NYqQ2VyWOrTTzW8wwkPQAQkVlw4rJoWdDZXuVSPl1liLBgAeGiNdUZylQaP0P0HbjfR1Hk0WInqWrQxoJzewPjw05_RLFEQ7-wU3Jrit5lu_CIdm3b2ptxhFGen-08CPCQQ'); background-size: contain; background-repeat: no-repeat;"></div>
<span class="font-label-lg text-label-lg text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-3 h-12 rounded-xl bg-surface-container-high hover:bg-surface-container-highest transition-colors tap-highlight-transparent border border-white/50">
<div class="w-5 h-5" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBD8SIew4_iIty62eW6mMn3O6R_r1RnPCC4ncDsEAFuf5Kn0Bu93FZzoYIjxvxOlXlNLOASx6CMOkekCAy5kWf-l5pM9VOFzkWPzdQR_O5AZKF_1LERN8n6RmWc5blC1C0pEIg1DY0kxTxRVUf17q0xC3t9LV0HEzIHGB0xkv9Oj6NBHsr6Ct7xkzie7-LpTpqIyM-s3ripw5-q6TIx7xJvEspspogbngOF-3cZwAvdODup-cdY4nBNpg'); background-size: contain; background-repeat: no-repeat;"></div>
<span class="font-label-lg text-label-lg text-on-surface">Facebook</span>
</button>
</div>
</div>
<!-- Footer / Registration Link -->
<footer class="text-center pt-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline underline-offset-4 decoration-2" href="#">Register Now</a>
</p>
</footer>
</div>
</main>
<!-- Aesthetic Decoration (Bottom Corner) -->
<div class="fixed bottom-0 right-0 w-64 h-64 -mb-32 -mr-32 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed top-0 left-0 w-64 h-64 -mt-32 -ml-32 bg-secondary/5 rounded-full blur-3xl pointer-events-none"></div>
<script>
        // Micro-interactions for button press
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
            btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
            btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
        });

        // Toggle Password Visibility
        const toggleBtn = document.querySelector('button.material-symbols-outlined');
        const passInput = document.getElementById('password');
        if(toggleBtn && passInput) {
            toggleBtn.addEventListener('click', () => {
                const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passInput.setAttribute('type', type);
                toggleBtn.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });
        }
    </script>
</body></html>
