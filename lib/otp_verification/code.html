<!-- Main Content Canvas -->
<main class="relative z-10 flex-grow flex items-center justify-center px-margin-mobile">

<p class="font-body-lg text-body-lg text-on-surface-variant mt-sm px-4">

<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-title-lg font-title-lg rounded-xl border-outline-variant bg-surface-container-low text-primary focus:ring-2 focus:ring-primary focus:border-primary transition-all" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-title-lg font-title-lg rounded-xl border-outline-variant bg-surface-container-low text-primary focus:ring-2 focus:ring-primary focus:border-primary transition-all" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-title-lg font-title-lg rounded-xl border-outline-variant bg-surface-container-low text-primary focus:ring-2 focus:ring-primary focus:border-primary transition-all" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-title-lg font-title-lg rounded-xl border-outline-variant bg-surface-container-low text-primary focus:ring-2 focus:ring-primary focus:border-primary transition-all" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-title-lg font-title-lg rounded-xl border-outline-variant bg-surface-container-low text-primary focus:ring-2 focus:ring-primary focus:border-primary transition-all" maxlength="1" type="text"/>

<!-- Visual Decor: Abstract Floating Glass Shape -->
<div class="fixed -bottom-24 -left-24 w-64 h-64 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed -top-24 -right-24 w-80 h-80 bg-secondary/10 rounded-full blur-3xl pointer-events-none"></div>
<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 0 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Allow only numbers
            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });

        // Timer Logic
        let timeLeft = 59;
        const timerElement = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');
        const resendText = document.getElementById('resend-timer-text');

        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.innerText = "";
                resendText.innerText = "Resend OTP";
                resendBtn.disabled = false;
                resendBtn.classList.add('hover:opacity-80');
            } else {
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                timerElement.innerText = `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
            }
            timeLeft -= 1;
        }, 1000);

        // Form Submit Simulation
        document.getElementById('otp-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const otp = Array.from(inputs).map(i => i.value).join('');
            if(otp.length === 6) {
                const btn = e.target.querySelector('button[type="submit"]');
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Verifying...';
                btn.classList.add('opacity-80', 'pointer-events-none');
                
                setTimeout(() => {
                    alert('OTP Verified Successfully! Welcome back to Lost & Found BD.');
                    btn.innerHTML = '<span>Verify Code</span><span class="material-symbols-outlined">arrow_forward</span>';
                    btn.classList.remove('opacity-80', 'pointer-events-none');
                }, 1500);
            } else {
                // Shake effect on error
                const card = document.querySelector('.glass-card');
                card.classList.add('animate-shake');
                setTimeout(() => card.classList.remove('animate-shake'), 400);
            }
        });
    </script>
<style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
            border-color: #ba1a1a !important;
        }
    </style>
