<!-- App Shell - Bottom Navigation (Suppressed based on Task Focus, but keeping layout reference) -->
<!-- Navigation logic: Settings is a task-focused sub-page, so no BottomNavBar here as per Shell Visibility rules -->
<script>
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        themeToggle.addEventListener('change', () => {
            if (themeToggle.checked) {
                html.classList.add('dark');
                themeIcon.textContent = 'dark_mode';
            } else {
                html.classList.remove('dark');
                themeIcon.textContent = 'light_mode';
            }
        });

        // Add subtle interaction sounds or vibration for feedback (conceptual)
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                if ('vibrate' in navigator) {
                    navigator.vibrate(5);
                }
            });
        });
    </script>
