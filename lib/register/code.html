<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

                    "surface-container": "#eceef0",
                    "primary-container": "#2563eb",
                    "on-surface": "#191c1e",
                    "error": "#ba1a1a",
                    "on-secondary": "#ffffff",
                    "surface-bright": "#f7f9fb",
                    "inverse-primary": "#b4c5ff",
                    "primary-fixed-dim": "#b4c5ff",
                    "on-primary": "#ffffff",
                    "tertiary-fixed-dim": "#4fdbc8",
                    "surface-variant": "#e0e3e5",
                    "surface-container-lowest": "#ffffff",
                    "surface-tint": "#0053db",
                    "on-primary-container": "#eeefff",
                    "surface-container-low": "#f2f4f6",
                    "outline": "#737686",
                    "secondary-fixed-dim": "#4cd7f6",
                    "on-primary-fixed": "#00174b",
                    "tertiary": "#006056",
                    "tertiary-container": "#007b6e",
                    "on-tertiary": "#ffffff",
                    "inverse-on-surface": "#eff1f3",
                    "outline-variant": "#c3c6d7",
                    "on-secondary-container": "#006172",
                    "on-tertiary-fixed-variant": "#005048",
                    "on-surface-variant": "#434655",

<style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #004ac6 0%, #00687a 100%);
            box-shadow: 0 4px 15px rgba(0, 74, 198, 0.2);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-tablet relative overflow-hidden">
<!-- Decorative Background Animation -->

<div class="max-w-md w-full z-10">
<!-- Logo/Brand Anchor -->
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mb-md shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-[32px]">travel_explore</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight">Lost &amp; Found BD</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Connecting people with their belongings.</p>
</div>
<!-- Registration Card -->
<div class="glass-card rounded-[32px] p-8 shadow-xl shadow-primary/5">
<h2 class="font-title-lg text-title-lg text-on-surface mb-xl">Create Account</h2>
<form action="#" class="space-y-md">
<!-- Full Name Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1">Full Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-transparent rounded-xl focus:ring-2 focus:ring-primary focus:bg-white focus:border-primary transition-all font-body-lg text-body-lg outline-none" placeholder="Enter your full name" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-transparent rounded-xl focus:ring-2 focus:ring-primary focus:bg-white focus:border-primary transition-all font-body-lg text-body-lg outline-none" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Phone Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1">Phone Number</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">phone_iphone</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-transparent rounded-xl focus:ring-2 focus:ring-primary focus:bg-white focus:border-primary transition-all font-body-lg text-body-lg outline-none" placeholder="+880 1XXX-XXXXXX" type="tel"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-low border-transparent rounded-xl focus:ring-2 focus:ring-primary focus:bg-white focus:border-primary transition-all font-body-lg text-body-lg outline-none" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- T&C Checkbox -->
<div class="flex items-start gap-3 pt-2">
<div class="flex items-center h-5">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary bg-surface transition-colors cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="terms">
                        I agree to the <a class="text-primary font-semibold hover:underline" href="#">Terms &amp; Conditions</a> and <a class="text-primary font-semibold hover:underline" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Register Button -->
<button class="w-full btn-gradient py-4 text-white font-title-md text-title-md rounded-full mt-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Register</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Login Link -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Login</a>
</p>
</div>
</div>
<!-- Language Selector (Bangladesh context) -->
<div class="mt-xl flex justify-center gap-4">
<button class="font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-colors">English</button>
<span class="w-px h-4 bg-outline-variant"></span>
<button class="font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-colors">বাংলা</button>
</div>
</div>
<!-- Micro-interaction Script -->
<script>
        // Simple input focus effects and validation visual cues
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('ring-2', 'ring-primary/20');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('ring-2', 'ring-primary/20');
            });
        });

        // Form submission prevent default for demo
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Animation for feedback
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Creating Account...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 2000);
        });
    </script>
</body></html>
