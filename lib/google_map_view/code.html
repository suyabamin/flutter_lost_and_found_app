<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .map-container {
            height: calc(100vh - 64px - 84px);
            margin-top: 64px;
        }
        .custom-marker {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .custom-marker:hover {
            transform: scale(1.2) translateY(-4px);
        }
        .bottom-sheet {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .marker-pulse::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 74, 198, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 74, 198, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 74, 198, 0); }
        }
    </style>

<!-- Floating Action Button for Report Item -->
<div class="fixed bottom-24 right-6 z-30">
<button class="flex items-center gap-2 bg-gradient-to-r from-primary to-secondary text-white px-6 py-4 rounded-[24px] shadow-2xl hover:scale-105 active:scale-95 transition-all group">
<span class="material-symbols-outlined group-hover:rotate-90 transition-transform duration-500">add</span>
<span class="font-title-md">Report Item</span>
</button>
</div>
<script>
        let isSheetOpen = false;
        function toggleBottomSheet() {
            const sheet = document.getElementById('itemBottomSheet');
            if (isSheetOpen) {
                sheet.style.transform = 'translateY(100%)';
            } else {
                sheet.style.transform = 'translateY(0)';
            }
            isSheetOpen = !isSheetOpen;
        }

        // Auto-show bottom sheet after a short delay to demonstrate interaction
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                toggleBottomSheet();
            }, 1000);
        });

        // Close sheet on map click
        document.querySelector('.map-container').addEventListener('click', (e) => {
            if (isSheetOpen && !e.target.closest('#itemBottomSheet') && !e.target.closest('.custom-marker')) {
                toggleBottomSheet();
            }
        });
    </script>
