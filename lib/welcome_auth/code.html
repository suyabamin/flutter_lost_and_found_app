<!DOCTYPE html>

<html class="light" lang="en"><head>

<title>Lost &amp; Found Bangladesh - Welcome</title>

                    "on-surface": "#191c1e",

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .btn-gradient {
            background: linear-gradient(90deg, #004ac6 0%, #00687a 100%);
        }
        .floating-accent {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
    </style>
</head>
<body class="bg-surface-bright text-on-surface min-h-screen flex items-center justify-center overflow-hidden">
<!-- Atmospheric Background Elements -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] right-[-5%] w-[400px] h-[400px] rounded-full bg-primary/5 blur-[100px] floating-accent" style="animation-delay: 0s;"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[300px] h-[300px] rounded-full bg-secondary/5 blur-[80px] floating-accent" style="animation-delay: 2s;"></div>
<div class="absolute top-[20%] left-[10%] w-[150px] h-[150px] rounded-full bg-tertiary-fixed/10 blur-[50px] floating-accent" style="animation-delay: 4s;"></div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-[480px] px-margin-mobile flex flex-col items-center justify-center relative z-10 animate-in fade-in slide-in-from-bottom-8 duration-700">
<!-- Logo Section -->
<div class="mb-xl flex flex-col items-center text-center">
<div class="w-32 h-32 mb-lg rounded-xl overflow-hidden shadow-sm shadow-primary/10 transition-transform duration-500 hover:scale-105 active:scale-95">
<img alt="Lost &amp; Found Bangladesh Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCDhVDH72m-UkJp4r0IjiXzfNXevgo-OzQpUSvBaC4kpcE-ikJ-tGAUXd57OLBlOlXieReMWC4ZmQIGJE1Z3Z8teLuFO8b_zNqlX4ZmUCEjG9fvu-rbIfrTCGGpg-ALb6XTyB2GQnwol0VPeNh8hBSWypgDsrc7D28ANsIcNifmJpJ13tOLKp6OC-L6LgaqYOpbzgV7exksbNZV_q76OuzVuiu09wtStydfrp-eOnSiaPVTrSzHRiDE8w"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight mb-xs">
                Lost &amp; Found BD
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] leading-relaxed">
                Reconnecting you with what matters most, anywhere in Bangladesh.
            </p>
</div>
<!-- Action Card -->
<div class="w-full glass-card rounded-2xl p-lg shadow-xl shadow-primary/5 flex flex-col gap-md">
<!-- Google Button -->
<button class="w-full h-14 bg-surface-container-lowest border border-outline-variant rounded-xl flex items-center justify-center gap-md px-lg font-label-lg text-label-lg text-on-surface-variant hover:bg-surface-container-low transition-all duration-300 group active:scale-95">
<svg class="w-6 h-6 group-hover:scale-110 transition-transform" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 6.21l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
<!-- Phone Button -->
<button class="w-full h-14 bg-surface-container-lowest border border-outline-variant rounded-xl flex items-center justify-center gap-md px-lg font-label-lg text-label-lg text-on-surface-variant hover:bg-surface-container-low transition-all duration-300 active:scale-95">
<span class="material-symbols-outlined text-primary" style="font-size: 24px;">call</span>
                Continue with Phone
            </button>
<div class="flex items-center gap-md my-xs">
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">or</span>
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
</div>
<!-- Email Login -->
<button class="w-full h-14 btn-gradient text-on-primary rounded-xl flex items-center justify-center gap-md px-lg font-title-md text-title-md shadow-lg shadow-primary/20 hover:opacity-90 transition-all duration-300 active:scale-95">
<span class="material-symbols-outlined" style="font-size: 24px;">mail</span>
                Login with Email
            </button>
<!-- Registration Link -->
<div class="mt-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-title-md hover:underline decoration-2 underline-offset-4 transition-all" href="#">Register</a>
</p>
</div>
</div>
<!-- Footer / Legal Info -->
<footer class="mt-xl text-center px-lg">
<p class="font-label-sm text-label-sm text-outline-variant max-w-[280px] mx-auto leading-normal">
                By continuing, you agree to our <a class="underline" href="#">Terms of Service</a> and <a class="underline" href="#">Privacy Policy</a>.
            </p>
</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', function() {
                this.classList.add('scale-95');
            });
            button.addEventListener('touchend', function() {
                this.classList.remove('scale-95');
            });
        });
    </script>
</body></html>
