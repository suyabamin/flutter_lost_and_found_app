<style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 74, 198, 0.08);
        }
        .btn-gradient {
            background: linear-gradient(90deg, #004ac6 0%, #00687a 100%);
            box-shadow: 0 4px 15px rgba(0, 74, 198, 0.2);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Top AppBar (Back Button only for focused task) -->
<nav class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl px-margin-mobile h-16 flex items-center">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container transition-colors active:scale-90 duration-200" onclick="window.history.back()">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
</nav>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center px-margin-mobile pt-20 pb-12">
<div class="w-full max-w-md">
<!-- Hero Image / Visual Element -->
<div class="mb-lg flex justify-center">
<div class="relative w-32 h-32">
<div class="absolute inset-0 bg-primary/10 rounded-full animate-pulse"></div>
<div class="absolute inset-4 bg-primary/20 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
</div>
</div>
</div>
<!-- Header Section -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-sm tracking-tight">
                    Reset Password
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto">
                    Enter your email to receive an OTP
                </p>
</div>
<!-- Input Form Card -->
<div class="glass-card rounded-2xl p-lg space-y-lg">
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-none rounded-xl font-body-lg text-body-lg focus:ring-2 focus:ring-primary transition-all placeholder:text-outline-variant" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<button class="w-full btn-gradient py-4 rounded-full font-title-md text-title-md text-on-primary flex items-center justify-center gap-sm active:scale-[0.98] transition-transform duration-200">
                    Send OTP
                    <span class="material-symbols-outlined text-xl">send</span>
</button>
</div>
<!-- Bottom Links -->
<div class="mt-xl text-center space-y-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Remember your password? 
                    <a class="text-primary font-title-md hover:underline decoration-2 underline-offset-4" href="#">Login here</a>
</p>
<div class="flex items-center justify-center gap-gutter pt-lg border-t border-outline-variant/30">
<span class="material-symbols-outlined text-primary text-sm">security</span>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">Secure Verification</span>
</div>
</div>
</div>
</main>
<!-- Background Atmospheric Effect -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px]"></div>
</div>
<!-- Script for subtle button interaction -->
<script>
        document.querySelector('.btn-gradient').addEventListener('click', function(e) {
            const btn = e.currentTarget;
            const originalText = btn.innerHTML;
            
            // Simple visual feedback
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Sending...';
            btn.disabled = true;
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-80');
                // Normally navigate to OTP verification screen here
            }, 2000);
        });
    </script>
