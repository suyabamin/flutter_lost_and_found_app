<!-- Interactive Script for micro-animations -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simulate loading progress
            const progressBar = document.getElementById('loader-progress');
            if (progressBar) {
                setTimeout(() => {
                    progressBar.style.width = '100%';
                }, 100);
            }

            // Subtle mouse tracking glow effect
            const container = document.body;
            container.addEventListener('mousemove', (e) => {
                const x = (e.clientX / window.innerWidth) * 100;
                const y = (e.clientY / window.innerHeight) * 100;
                container.style.setProperty('--mouse-x', `${x}%`);
                container.style.setProperty('--mouse-y', `${y}%`);
            });
        });

        // Suppression Logic: This is a Splash screen, so we do NOT render BottomNavBar or TopAppBar
        // as per the "Linear/Transactional" rule in the Shared Components Logic.
    </script>
<!-- Subtle Vignette and Texture -->
