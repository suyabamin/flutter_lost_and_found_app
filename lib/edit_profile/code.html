<body class="bg-surface font-body-lg text-on-surface min-h-screen">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/20 shadow-sm shadow-primary/10 flex justify-between items-center px-margin-mobile h-16">

</div>
<button class="bg-primary text-on-primary px-6 py-2 rounded-full font-label-lg text-label-lg shadow-lg shadow-primary/20 hover:opacity-90 active:scale-95 transition-all">
            Save

</header>
<main class="pt-24 pb-32 px-margin-mobile max-w-2xl mx-auto space-y-8">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center justify-center py-4">

</div>
<div class="absolute inset-0 bg-primary/20 rounded-full opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
<div class="bg-primary text-on-primary p-3 rounded-full shadow-lg">
<span class="material-symbols-outlined">photo_camera</span>
</div>
</div>
<div class="absolute bottom-1 right-1 bg-surface-container-highest p-2 rounded-full border-2 border-white shadow-md">

</div>
<p class="mt-4 font-label-sm text-label-sm text-outline uppercase tracking-wider">Change Profile Photo</p>
</section>
<!-- Form Fields -->
<form class="space-y-6">
<!-- Full Name -->
<div class="space-y-sm">
<label class="block font-label-lg text-label-lg text-on-surface-variant px-1">Full Name</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-4 py-1 border border-transparent transition-all duration-200 active-field-focus">
<span class="material-symbols-outlined text-outline mr-3">person</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-3 font-body-lg text-body-lg text-on-surface" placeholder="Enter your full name" type="text" value="Sabbir Ahmed"/>
</div>
</div>
<!-- Email (Verified) -->
<div class="space-y-sm">
<label class="block font-label-lg text-label-lg text-on-surface-variant px-1">Email Address</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-4 py-1 border border-transparent transition-all duration-200 active-field-focus">
<span class="material-symbols-outlined text-outline mr-3">mail</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-3 font-body-lg text-body-lg text-on-surface" placeholder="Enter email" type="email" value="sabbir.ahmed@example.com"/>
<div class="flex items-center gap-1 bg-tertiary-container/20 px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-tertiary text-[18px]" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="text-[12px] font-bold text-tertiary uppercase">Verified</span>
</div>
</div>
</div>
<!-- Phone Number -->

<label class="block font-label-lg text-label-lg text-on-surface-variant px-1">Phone Number</label>

<span class="material-symbols-outlined text-outline mr-3">call</span>
<span class="font-body-lg text-on-surface-variant mr-1">+880</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-3 font-body-lg text-body-lg text-on-surface" placeholder="Phone number" type="tel" value="1712345678"/>
</div>
</div>
<!-- City (Location) -->
<div class="space-y-sm">
<label class="block font-label-lg text-label-lg text-on-surface-variant px-1">City</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-4 py-1 border border-transparent transition-all duration-200 active-field-focus">

<option value="Chittagong">Chittagong</option>
<option value="Sylhet">Sylhet</option>
<option value="Rajshahi">Rajshahi</option>
<option value="Khulna">Khulna</option>
</select>
<span class="material-symbols-outlined text-outline absolute right-4 pointer-events-none">expand_more</span>
</div>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface-container/70 backdrop-blur-2xl rounded-t-xl shadow-[0_-4px_20px_rgba(0,74,198,0.1)]">
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">home</span>

<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">search</span>

</div>
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full w-12 h-12 shadow-lg -mt-8 scale-110 duration-300">
<span class="material-symbols-outlined">add_circle</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">

<div class="flex flex-col items-center justify-center bg-primary-container/30 text-primary rounded-xl px-3 py-1 scale-110 duration-300 ease-out">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm mt-0.5">Profile</span>
</div>

<script>
        // Micro-interaction for input fields
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('shadow-md');
                input.previousElementSibling.classList.replace('text-outline', 'text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('shadow-md');
                input.previousElementSibling.classList.replace('text-primary', 'text-outline');
            });
        });

        // Save button feedback
        const saveBtn = document.querySelector('header button.bg-primary');
        saveBtn.addEventListener('click', () => {
            saveBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
            setTimeout(() => {
                saveBtn.innerHTML = 'Save';
                // Simple toast simulation
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-6 py-3 rounded-full shadow-2xl z-[100] font-label-lg flex items-center gap-2 transition-all duration-500 opacity-0 transform translate-y-4';
                toast.innerHTML = '<span class="material-symbols-outlined text-secondary-fixed">check_circle</span> Profile updated successfully';
                document.body.appendChild(toast);
                
                requestAnimationFrame(() => {
                    toast.classList.remove('opacity-0', 'translate-y-4');
                });

                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-4');
                    setTimeout(() => toast.remove(), 500);
                }, 3000);
            }, 1000);
        });
    </script>
